[project]
name = "cnn-classifier"
version = "0.1.0"
description = "It's a simple Image classifier model of Cat and Dog deoployed using fastapi for backend and streamlit
               for frontend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.137.1",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "python-multipart>=0.0.32",
    "streamlit>=1.58.0",
    "uvicorn>=0.49.0",
]
